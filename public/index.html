<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinutesAI — 게임 개발 회의록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #151820;
  --surface2: #1c2030;
  --surface3: #232840;
  --border: #2a2f45;
  --border2: #363d58;
  --accent: #4f8bff;
  --accent2: #7c5fff;
  --accent3: #00d4aa;
  --warn: #ff6b4a;
  --text: #e8ecf5;
  --text2: #8892b0;
  --text3: #4a5470;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Pretendard', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.app { display: flex; height: 100vh; overflow: hidden; }

.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.logo-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.logo-text span { color: var(--accent); }

.btn-new {
  width: 100%;
  padding: 9px 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  justify-content: center;
  transition: opacity 0.2s, transform 0.1s;
}
.btn-new:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-new:active { transform: translateY(0); }

.sidebar-section { padding: 12px 10px 4px; font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; }

.meeting-list { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
.meeting-item {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.meeting-item:hover { background: var(--surface2); }
.meeting-item.active { background: var(--surface3); border-color: var(--border2); }
.meeting-item-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meeting-item-meta { font-size: 11px; color: var(--text3); display: flex; gap: 6px; }
.meeting-tag {
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
}

.empty-list { padding: 24px 12px; text-align: center; color: var(--text3); font-size: 12px; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  padding: 0 24px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  flex-shrink: 0;
}
.topbar-title { font-size: 15px; font-weight: 600; flex: 1; }
.topbar-actions { display: flex; gap: 8px; }
.btn-icon {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 8px;
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all 0.15s;
}
.btn-icon:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }

.content { flex: 1; display: flex; overflow: hidden; }

.editor-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--border);
}

.editor-toolbar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.toolbar-label { font-size: 12px; color: var(--text3); font-weight: 500; }

.template-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.chip {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: rgba(79,139,255,0.15); border-color: var(--accent); color: var(--accent); }

.meta-row {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 10px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.meta-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.meta-input:focus { border-color: var(--accent); }
.meta-input::placeholder { color: var(--text3); }
.meta-input.wide { flex: 1; min-width: 160px; }

.editor-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 16px 20px; gap: 10px; }

.input-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 4px; }

.raw-textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  resize: none;
  outline: none;
  line-height: 1.7;
  transition: border-color 0.15s;
}
.raw-textarea:focus { border-color: var(--accent); }
.raw-textarea::placeholder { color: var(--text3); line-height: 1.8; }

.editor-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
}
.char-count { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
.model-badge { font-size: 10px; color: var(--accent3); background: rgba(0,212,170,0.12); padding: 2px 8px; border-radius: 4px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.btn-generate {
  margin-left: auto;
  padding: 9px 20px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: opacity 0.2s, transform 0.1s;
  font-family: inherit;
}
.btn-generate:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
.btn-generate:active { transform: translateY(0); }
.btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

.result-panel {
  width: 480px;
  min-width: 380px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface);
}

.result-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.result-title { font-size: 13px; font-weight: 600; flex: 1; }
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text3);
}
.status-dot.active { background: var(--accent3); box-shadow: 0 0 6px var(--accent3); }

.result-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

.empty-state {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--text3);
}
.empty-icon { font-size: 36px; opacity: 0.4; }
.empty-text { font-size: 13px; }

.loading-state {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text3); }
.loading-sub { font-size: 11px; color: var(--text3); opacity: 0.6; }

.result-content { display: flex; flex-direction: column; gap: 14px; animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

.result-meta {
  padding: 10px 14px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  display: flex; gap: 16px; flex-wrap: wrap;
}
.result-meta-item { display: flex; flex-direction: column; gap: 2px; }
.result-meta-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.result-meta-value { font-size: 12px; color: var(--text); font-weight: 500; }

.result-section { display: flex; flex-direction: column; gap: 6px; }
.result-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  display: flex; align-items: center; gap: 6px;
}
.result-section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.result-item {
  padding: 8px 12px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  border-left: 3px solid transparent;
  font-size: 13px;
  line-height: 1.6;
}
.result-item.decision { border-left-color: var(--accent3); }
.result-item.action { border-left-color: var(--accent); }
.result-item.pending { border-left-color: var(--warn); }
.result-item.issue { border-left-color: #ff4a6b; }
.result-item.note { border-left-color: var(--text3); }

.action-meta {
  display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap;
}
.action-badge {
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  background: rgba(79,139,255,0.15);
  color: var(--accent);
}
.action-badge.assignee { background: rgba(124,95,255,0.15); color: var(--accent2); }
.action-badge.due { background: rgba(0,212,170,0.12); color: var(--accent3); }
.action-badge.priority-high { background: rgba(255,75,75,0.15); color: #ff6b6b; }
.action-badge.priority-mid { background: rgba(255,165,0,0.12); color: #ffa040; }
.action-badge.priority-low { background: rgba(100,200,100,0.12); color: #64cc64; }

.summary-box {
  padding: 12px 14px;
  background: rgba(79,139,255,0.07);
  border-radius: var(--radius-sm);
  border: 1px solid rgba(79,139,255,0.2);
  font-size: 13px;
  color: var(--text2);
  line-height: 1.7;
}

.result-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
  flex-shrink: 0;
}
.btn-copy, .btn-save {
  flex: 1;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: all 0.15s;
  font-family: inherit;
}
.btn-copy {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
}
.btn-copy:hover { background: var(--surface2); color: var(--text); }
.btn-save {
  background: rgba(0,212,170,0.15);
  border: 1px solid rgba(0,212,170,0.3);
  color: var(--accent3);
}
.btn-save:hover { background: rgba(0,212,170,0.25); }
.btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 8px 18px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  z-index: 200;
  animation: fadeUp 0.2s ease;
  white-space: nowrap;
}

.tag-sprint { background: rgba(79,139,255,0.15); color: var(--accent); }
.tag-qa { background: rgba(255,75,75,0.15); color: #ff6b6b; }
.tag-plan { background: rgba(124,95,255,0.15); color: var(--accent2); }
.tag-post { background: rgba(255,165,0,0.15); color: #ffa040; }
.tag-general { background: rgba(100,100,150,0.2); color: var(--text2); }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">📋</div>
        <div class="logo-text">Minutes<span>AI</span></div>
      </div>
      <button class="btn-new" onclick="newMeeting()">
        <span>＋</span> 새 회의록
      </button>
    </div>
    <div class="sidebar-section">저장된 회의록</div>
    <div class="meeting-list" id="meetingList">
      <div class="empty-list" id="emptyList">저장된 회의록이 없습니다</div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">새 회의록</div>
      <div class="topbar-actions">
        <button class="btn-icon" title="회의록 삭제" onclick="deleteCurrentMeeting()">🗑</button>
      </div>
    </div>

    <div class="content">
      <div class="editor-panel">
        <div class="editor-toolbar">
          <span class="toolbar-label">템플릿</span>
          <div class="template-chips" id="templateChips"></div>
        </div>
        <div class="meta-row">
          <input class="meta-input wide" id="meetingTitle" type="text" placeholder="회의 제목 (예: 2.0 패치 기획 리뷰)" oninput="updateTitle()">
          <input class="meta-input" id="meetingDate" type="date">
          <input class="meta-input" id="meetingAttendees" type="text" placeholder="참석자 (쉼표 구분)" style="width:200px">
        </div>
        <div class="editor-body">
          <div>
            <div class="input-label">회의 내용 입력</div>
          </div>
          <textarea class="raw-textarea" id="rawInput"
            placeholder="회의 내용을 자유롭게 입력하세요.
날것의 메모, 대화 내용, 키워드 나열 등 어떤 형식이든 괜찮습니다.

예시)
- 다음 스프린트 목표: 전투 밸런스 패치 + UI 개선
- 기획팀 김대리: 보스 공격 패턴 3종 추가 필요, 이번 주 금요일까지
- QA팀: 인벤토리 버그 재현 확인됨 (iOS 14 이하에서만), 담당 박개발
- 서버팀: 로그인 세션 이슈 다음 스프린트로 보류
- 클라이언트 빌드 배포 화요일 확정
- 미결: 신규 캐릭터 밸런스 수치 확정 안됨, 기획팀 검토 후 재논의" oninput="updateCharCount()"></textarea>
        </div>
        <div class="editor-footer">
          <span class="char-count" id="charCount">0자</span>
          <span class="model-badge">GPT-4.1-mini</span>
          <button class="btn-generate" id="generateBtn" onclick="generate()">
            ✦ 회의록 생성
          </button>
        </div>
      </div>

      <div class="result-panel">
        <div class="result-header">
          <div class="status-dot" id="statusDot"></div>
          <div class="result-title">회의록 결과</div>
        </div>
        <div class="result-body" id="resultBody">
          <div class="empty-state">
            <div class="empty-icon">✦</div>
            <div class="empty-text">회의 내용을 입력하고 생성하세요</div>
          </div>
        </div>
        <div class="result-footer">
          <button class="btn-copy" onclick="copyResult()">📋 복사</button>
          <button class="btn-save" id="saveBtn" onclick="saveMeeting()" disabled>💾 저장</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const TEMPLATES = [
  { id:'sprint', label:'스프린트 플래닝', icon:'🏃', tag:'tag-sprint',
    hint:'스프린트 목표, 태스크 분배, 담당자, 기한 위주로 정리해주세요.' },
  { id:'qa', label:'QA 리뷰', icon:'🐛', tag:'tag-qa',
    hint:'버그 목록, 재현 경로, 우선순위, 담당자, 해결 기한 위주로 정리해주세요.' },
  { id:'plan', label:'기획 리뷰', icon:'📐', tag:'tag-plan',
    hint:'결정사항, 보류사항, 수정 방향, 후속 논의 사항 위주로 정리해주세요.' },
  { id:'post', label:'포스트모템', icon:'🔍', tag:'tag-post',
    hint:'잘된 점, 개선점, 근본 원인, 재발 방지 액션아이템 위주로 정리해주세요.' },
  { id:'general', label:'일반 회의', icon:'💬', tag:'tag-general',
    hint:'결정사항, 액션아이템, 담당자, 기한, 보류 사항 위주로 정리해주세요.' },
];

let state = {
  currentId: null,
  template: 'general',
  meetings: JSON.parse(localStorage.getItem('minutesai_meetings') || '[]'),
  result: null,
  loading: false,
};

function init() {
  document.getElementById('meetingDate').value = new Date().toISOString().split('T')[0];

  const container = document.getElementById('templateChips');
  TEMPLATES.forEach(t => {
    const el = document.createElement('button');
    el.className = 'chip' + (t.id === state.template ? ' active' : '');
    el.textContent = t.icon + ' ' + t.label;
    el.onclick = () => selectTemplate(t.id);
    el.dataset.id = t.id;
    container.appendChild(el);
  });

  renderMeetingList();
}

function selectTemplate(id) {
  state.template = id;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.id === id);
  });
}

function saveMeetings() {
  localStorage.setItem('minutesai_meetings', JSON.stringify(state.meetings));
}

function renderMeetingList() {
  const list = document.getElementById('meetingList');
  const empty = document.getElementById('emptyList');
  const meetings = [...state.meetings].reverse();

  if (meetings.length === 0) {
    empty.style.display = 'block';
    list.querySelectorAll('.meeting-item').forEach(e => e.remove());
    return;
  }
  empty.style.display = 'none';
  list.querySelectorAll('.meeting-item').forEach(e => e.remove());

  meetings.forEach(m => {
    const t = TEMPLATES.find(t => t.id === m.template) || TEMPLATES[4];
    const el = document.createElement('div');
    el.className = 'meeting-item' + (m.id === state.currentId ? ' active' : '');
    el.dataset.id = m.id;
    el.innerHTML = `
      <div class="meeting-item-title">${m.title || '제목 없음'}</div>
      <div class="meeting-item-meta">
        <span>${m.date || ''}</span>
        <span class="meeting-tag ${t.tag}">${t.icon} ${t.label}</span>
      </div>
    `;
    el.onclick = () => loadMeeting(m.id);
    list.appendChild(el);
  });
}

function newMeeting() {
  state.currentId = null;
  state.result = null;
  document.getElementById('meetingTitle').value = '';
  document.getElementById('meetingDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('meetingAttendees').value = '';
  document.getElementById('rawInput').value = '';
  document.getElementById('topbarTitle').textContent = '새 회의록';
  selectTemplate('general');
  updateCharCount();
  showEmptyResult();
  renderMeetingList();
}

function loadMeeting(id) {
  const m = state.meetings.find(m => m.id === id);
  if (!m) return;
  state.currentId = id;
  state.result = m.result;
  document.getElementById('meetingTitle').value = m.title || '';
  document.getElementById('meetingDate').value = m.date || '';
  document.getElementById('meetingAttendees').value = m.attendees || '';
  document.getElementById('rawInput').value = m.raw || '';
  document.getElementById('topbarTitle').textContent = m.title || '제목 없음';
  selectTemplate(m.template || 'general');
  updateCharCount();
  if (m.result) renderResult(m.result);
  renderMeetingList();
}

function saveMeeting() {
  if (!state.result) return;
  const title = document.getElementById('meetingTitle').value.trim() || '제목 없음';
  const date = document.getElementById('meetingDate').value;
  const attendees = document.getElementById('meetingAttendees').value.trim();
  const raw = document.getElementById('rawInput').value.trim();

  if (state.currentId) {
    const idx = state.meetings.findIndex(m => m.id === state.currentId);
    if (idx !== -1) {
      state.meetings[idx] = { ...state.meetings[idx], title, date, attendees, raw, template: state.template, result: state.result };
    }
  } else {
    const id = Date.now().toString();
    state.currentId = id;
    state.meetings.push({ id, title, date, attendees, raw, template: state.template, result: state.result });
  }
  saveMeetings();
  renderMeetingList();
  document.getElementById('topbarTitle').textContent = title;
  showToast('💾 저장되었습니다');
}

function deleteCurrentMeeting() {
  if (!state.currentId) { showToast('삭제할 회의록이 없습니다'); return; }
  state.meetings = state.meetings.filter(m => m.id !== state.currentId);
  saveMeetings();
  newMeeting();
  showToast('🗑 삭제되었습니다');
}

function updateTitle() {
  const t = document.getElementById('meetingTitle').value.trim();
  document.getElementById('topbarTitle').textContent = t || '새 회의록';
}

function updateCharCount() {
  const len = document.getElementById('rawInput').value.length;
  document.getElementById('charCount').textContent = len.toLocaleString() + '자';
}

async function generate() {
  const raw = document.getElementById('rawInput').value.trim();
  if (!raw) { showToast('회의 내용을 입력해주세요'); return; }

  const template = TEMPLATES.find(t => t.id === state.template);
  const attendees = document.getElementById('meetingAttendees').value.trim();
  const date = document.getElementById('meetingDate').value;

  state.loading = true;
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('generateBtn').textContent = '생성 중...';
  document.getElementById('saveBtn').disabled = true;
  document.getElementById('statusDot').classList.remove('active');
  showLoading();

  const systemPrompt = `당신은 게임 개발 회의록 전문 AI 어시스턴트입니다.
아래 게임 개발 용어와 컨텍스트를 잘 이해합니다:
- 개발: 빌드, 배포, 클라이언트, 서버, QA, 버그, 핫픽스, 패치, 마이그레이션, API, SDK
- 기획: 밸런스, 스킬, 콘텐츠, 시나리오, UI/UX, 프로토타입, 게임플레이, 메타, 드롭률
- 운영: 스프린트, 마일스톤, 칸반, 데드라인, 백로그, 포스트모템, KPI, DAU, 리텐션
- 직군: 기획, 클라이언트, 서버, 아트, QA, PM, TA(테크아트), TD(테크디렉터)

${template?.hint || ''}

반드시 아래 JSON 형식으로만 응답하세요 (마크다운 코드블록 없이 순수 JSON):
{
  "summary": "한 문단 회의 전체 요약 (2-3문장)",
  "decisions": ["결정사항1", "결정사항2"],
  "actions": [
    { "task": "태스크 내용", "assignee": "담당자 (없으면 null)", "due": "기한 (없으면 null)", "priority": "high|mid|low" }
  ],
  "pending": ["보류/미결사항1", "보류/미결사항2"],
  "issues": ["리스크나 이슈사항1"],
  "nextMeeting": "다음 회의 관련 언급 (없으면 null)"
}`;

  const userPrompt = `회의 유형: ${template?.label}
날짜: ${date}
참석자: ${attendees || '미입력'}

[회의 내용]
${raw}`;

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ systemPrompt, userPrompt }),
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const text = data.text || '';
    const json = JSON.parse(text.replace(/```json|```/g, '').trim());
    state.result = { ...json, date, attendees, template: state.template, raw };
    renderResult(state.result);
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('statusDot').classList.add('active');
  } catch(e) {
    showErrorResult(e.message);
    showToast('❌ 오류: ' + e.message.slice(0, 60));
  } finally {
    state.loading = false;
    document.getElementById('generateBtn').disabled = false;
    document.getElementById('generateBtn').textContent = '✦ 회의록 생성';
  }
}

function showLoading() {
  document.getElementById('resultBody').innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">회의 내용 분석 중...</div>
      <div class="loading-sub">GPT-4.1-mini가 게임 개발 용어를 인식하고 구조화합니다</div>
    </div>`;
}

function showEmptyResult() {
  document.getElementById('statusDot').classList.remove('active');
  document.getElementById('saveBtn').disabled = true;
  document.getElementById('resultBody').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">✦</div>
      <div class="empty-text">회의 내용을 입력하고 생성하세요</div>
    </div>`;
}

function showErrorResult(msg) {
  document.getElementById('resultBody').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">⚠️</div>
      <div class="empty-text" style="color:var(--warn)">${msg || '오류가 발생했습니다'}</div>
    </div>`;
}

function renderResult(r) {
  const priLabel = { high:'🔴 높음', mid:'🟡 중간', low:'🟢 낮음' };
  const priClass = { high:'priority-high', mid:'priority-mid', low:'priority-low' };

  let html = '<div class="result-content">';

  html += `<div class="result-meta">
    <div class="result-meta-item"><div class="result-meta-label">날짜</div><div class="result-meta-value">${r.date||'-'}</div></div>
    <div class="result-meta-item"><div class="result-meta-label">유형</div><div class="result-meta-value">${TEMPLATES.find(t=>t.id===r.template)?.label||'-'}</div></div>
    <div class="result-meta-item"><div class="result-meta-label">참석자</div><div class="result-meta-value">${r.attendees||'-'}</div></div>
  </div>`;

  if (r.summary) {
    html += `<div class="result-section">
      <div class="result-section-title">요약</div>
      <div class="summary-box">${r.summary}</div>
    </div>`;
  }

  if (r.decisions?.length) {
    html += `<div class="result-section"><div class="result-section-title">✅ 결정사항</div>`;
    r.decisions.forEach(d => {
      html += `<div class="result-item decision">${d}</div>`;
    });
    html += '</div>';
  }

  if (r.actions?.length) {
    html += `<div class="result-section"><div class="result-section-title">🎯 액션아이템</div>`;
    r.actions.forEach(a => {
      html += `<div class="result-item action">
        ${a.task}
        <div class="action-meta">
          ${a.assignee ? `<span class="action-badge assignee">👤 ${a.assignee}</span>` : ''}
          ${a.due ? `<span class="action-badge due">📅 ${a.due}</span>` : ''}
          ${a.priority ? `<span class="action-badge ${priClass[a.priority]||''}">${priLabel[a.priority]||a.priority}</span>` : ''}
        </div>
      </div>`;
    });
    html += '</div>';
  }

  if (r.pending?.length) {
    html += `<div class="result-section"><div class="result-section-title">⏳ 보류/미결</div>`;
    r.pending.forEach(p => {
      html += `<div class="result-item pending">${p}</div>`;
    });
    html += '</div>';
  }

  if (r.issues?.length) {
    html += `<div class="result-section"><div class="result-section-title">⚠️ 이슈/리스크</div>`;
    r.issues.forEach(i => {
      html += `<div class="result-item issue">${i}</div>`;
    });
    html += '</div>';
  }

  if (r.nextMeeting) {
    html += `<div class="result-section"><div class="result-section-title">📅 다음 회의</div>
      <div class="result-item note">${r.nextMeeting}</div>
    </div>`;
  }

  html += '</div>';
  document.getElementById('resultBody').innerHTML = html;
}

function copyResult() {
  if (!state.result) { showToast('복사할 내용이 없습니다'); return; }
  const r = state.result;
  const t = TEMPLATES.find(t=>t.id===r.template);
  let text = `# ${document.getElementById('meetingTitle').value || '회의록'}\n`;
  text += `날짜: ${r.date||''} | 유형: ${t?.label||''} | 참석자: ${r.attendees||''}\n\n`;
  if(r.summary) text += `## 요약\n${r.summary}\n\n`;
  if(r.decisions?.length) text += `## 결정사항\n${r.decisions.map(d=>`- ${d}`).join('\n')}\n\n`;
  if(r.actions?.length) text += `## 액션아이템\n${r.actions.map(a=>`- ${a.task}${a.assignee?' ('+a.assignee+')':''}${a.due?' ~'+a.due:''}`).join('\n')}\n\n`;
  if(r.pending?.length) text += `## 보류/미결\n${r.pending.map(p=>`- ${p}`).join('\n')}\n\n`;
  if(r.issues?.length) text += `## 이슈/리스크\n${r.issues.map(i=>`- ${i}`).join('\n')}\n\n`;
  if(r.nextMeeting) text += `## 다음 회의\n${r.nextMeeting}\n`;
  navigator.clipboard.writeText(text).then(()=>showToast('📋 클립보드에 복사되었습니다'));
}

let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  let t = document.querySelector('.toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(()=>t.remove(), 2500);
}

init();
</script>
</body>
</html>
